name: android_file_storage
description: "A modern Flutter plugin to save files directly to Android Downloads directory using MediaStore API without extra runtime permissions."
version: 0.0.1
homepage:

environment:
  sdk: ^3.13.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:

  plugin:
    platforms:
      android:
        package: com.shabeen07.android_file_storage
        pluginClass: AndroidFileStoragePlugin
